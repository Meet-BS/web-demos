<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static OTP Auth - Page 1 of 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00796B 0%, #4DB6AC 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-container {
            background: white; padding: 40px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 420px; width: 100%;
        }
        h1 { text-align: center; margin-bottom: 8px; color: #333; }
        .step-tag { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px;
            font-size: 16px; transition: border-color 0.3s;
        }
        input:focus { border-color: #00796B; outline: none; }
        .btn {
            width: 100%; background: #00796B; color: white; border: none;
            padding: 12px; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
        .btn:hover { background: #00695C; }
        .error { color: #f44336; margin-bottom: 15px; padding: 10px; background: #ffebee; border-radius: 5px; }
        .demo-credentials {
            background: #e0f2f1; padding: 14px 18px; border-radius: 8px; margin-bottom: 20px;
            border-left: 4px solid #00796B; font-size: 14px; color: #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Log in</h1>
        <p class="step-tag">Page 1 of 3 &middot; Username and password</p>

        <div class="demo-credentials">
            Demo credentials: <b>test@meet.com</b> / <b>Meet@123<</b> (any user from the other demos works)
        </div>

        <div id="error" class="error" hidden></div>

        <form method="POST" action="/static-otp-auth/login">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" id="login-btn" class="btn">Log in to my account</button>
        </form>
    </div>

    <script>
        const error = new URLSearchParams(window.location.search).get('error');
        if (error) {
            const el = document.getElementById('error');
            el.textContent = error;
            el.hidden = false;
        }
    </script>
</body>
</html>
