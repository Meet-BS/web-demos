<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static OTP Auth - Page 2 of 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00796B 0%, #4DB6AC 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-container {
            background: white; padding: 40px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 440px; width: 100%;
        }
        h1 { text-align: center; margin-bottom: 8px; color: #333; font-size: 26px; }
        .step-tag { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
        fieldset { border: none; margin-bottom: 20px; }
        legend { font-weight: bold; color: #555; margin-bottom: 12px; }
        .option {
            display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 10px;
            border: 2px solid #ddd; border-radius: 8px; cursor: pointer; color: #333;
        }
        .option:has(input:checked) { border-color: #00796B; background: #e0f2f1; }
        .option input { width: 18px; height: 18px; accent-color: #00796B; }
        .option small { display: block; color: #888; }
        .btn {
            width: 100%; background: #00796B; color: white; border: none;
            padding: 14px; border-radius: 5px; font-size: 16px; cursor: pointer;
        }
        .btn:hover { background: #00695C; }
        .error { color: #f44336; margin-bottom: 15px; padding: 10px; background: #ffebee; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>How would you like us to send your code?</h1>
        <p class="step-tag">Page 2 of 3 &middot; Choose a channel, then Continue</p>

        <div id="error" class="error" hidden></div>

        <form method="POST" action="/static-otp-auth/send-code">
            <fieldset>
                <legend>Send my code by</legend>
                <label class="option" for="channel-email">
                    <input type="radio" id="channel-email" name="channel" value="email">
                    <span>Email<small>a****@example.com</small></span>
                </label>
                <label class="option" for="channel-sms">
                    <input type="radio" id="channel-sms" name="channel" value="sms">
                    <span>Text message<small>Mobile ending ****21</small></span>
                </label>
            </fieldset>
            <button type="submit" id="continue-btn" class="btn">Continue</button>
        </form>
    </div>

    <script>
        const error = new URLSearchParams(window.location.search).get('error');
        if (error) {
            const el = document.getElementById('error');
            el.textContent = error;
            el.hidden = false;
        }
    </script>
</body>
</html>
